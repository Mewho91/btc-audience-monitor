
name: BTC Audience Monitor

on:
  schedule:
    - cron: '00 13 * * *'
      timezone: 'Europe/Warsaw'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz pliki
        uses: actions/checkout@v4

      - name: Zainstaluj Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zainstaluj biblioteki
        run: pip install -r requirements.txt

      - name: Pobierz dane YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python monitor.py --collect

      - name: Zapisz wyniki i wykres
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monitor.sqlite index.html export.csv
          if ! git diff --cached --quiet; then
            git commit -m "Aktualizacja danych YouTube"
            git push
          fi
